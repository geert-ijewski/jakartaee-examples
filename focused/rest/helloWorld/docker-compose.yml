services:
  openliberty:
    image: openliberty/open-liberty
    container_name: openliberty
    ports:
      - "9080:9080"   # HTTP
      - "9778:8778"   # Jolokia
    volumes:
      - ./target:/config/dropins
      - ./jolokia:/opt/jolokia
    environment:
      WLP_LOGGING_CONSOLE_FORMAT : JSON
      WLP_LOGGING_CONSOLE_LOGLEVEL : INFO
      WLP_LOGGING_CONSOLE_SOURCE : message
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/jolokia/jolokia-jvm.jar=port=8778,host=0.0.0.0"

  payara:
    image: payara/server-full:6.2024.6-jdk21
    container_name: payara
    ports:
      - "8080:8080"   # HTTP
      - "4848:4848"   # Admin console
      - "8778:8778"   # Jolokia
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: "-javaagent:/opt/jolokia/jolokia-jvm.jar=port=8778,host=0.0.0.0"
    volumes:
      - ./target:/opt/payara/deployments
      - ./jolokia:/opt/jolokia
  checkmk:
    image: checkmk/check-mk-raw:2.3.0-latest
    container_name: checkmk
    hostname: checkmk
    restart: unless-stopped
    ports:
      - "8081:5000"          # Web UI port
    environment:
      CMK_SITE_ID: monitoring
      CMK_PASSWORD: admin    # admin password for the web UI
      CMK_LIVESTATUS_TCP: 'on'
    volumes:
      - ./checkmk:/omd/sites
    depends_on:
      - openliberty
      - payara